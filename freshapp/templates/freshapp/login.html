{% load static %}
<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login DoFresh</title>
        <link rel="stylesheet" href="{% static 'css/layout.css' %}">
        <link rel="stylesheet" href="{% static 'css/login.css' %}">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    </head>

    <body>
        <div id="login-parent-div">
            <div id="lumi">
                <img src="{% static 'img/lumi_main.svg' %}" alt="Lumi character image">
            </div>

            <h2>Sign In</h2>
            <h5>Welcome back</h5>

            {% if message %}
            <div>{{message}}</div>
            {% endif %}

            <div style="height: 28px;"></div>

            <form action="{% url 'login' %}" method="post">
                <input type="text" name="username" placeholder="☺︎ Username">
                <br>
                <input type="password" name="password" placeholder="🔒︎ Password">
                <br>
                {% csrf_token %}
                <p>First time? Hustle <a href="{% url 'signup' %}">here</a>!</p>
                <input class="btn-purple" type="submit" value="Login">
            </form>
        </div>
    </body>

</html>
