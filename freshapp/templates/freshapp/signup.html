{% load static %}
<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login DoFresh</title>
        <link rel="stylesheet" href="{% static 'css/layout.css' %}">
        <link rel="stylesheet" href="{% static 'css/login.css' %}">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

        <style>
            body {
                background-image: url(https://img.magnific.com/free-vector/modern-soft-violet-watercolor-paint-texture-design-background_1055-14389.jpg?semt=ais_hybrid&w=740&q=80);
            }
        </style>
    </head>

    <body>
        <div id="signup-parent-div">
            <div id="lumi">
                <img src="{% static 'img/lumi_main.svg' %}" alt="Lumi character image">
            </div>

            <h2>Sign Up</h2>
            <h5>Hello, first time?</h5>

            {% if message %}
            <div>{{message}}</div>
            {% endif %}

            <div style="height: 28px;"></div>
            
            <form action="{% url 'signup' %}" method="post">
                <input type="text" name="username" placeholder="☺︎ Username">
                <br>
                <input type="password" name="password" placeholder="🔒︎ Password">
                <br>
                {% csrf_token %}
                <p>Already have an account? Login <a href="{% url 'login' %}">here</a>!</p>
                <input class="btn-purple" type="submit" value="Join Us!">
            </form>
        </div>
    </body>

</html>
