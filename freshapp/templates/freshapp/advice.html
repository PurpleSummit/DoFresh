{% extends "freshapp/layout.html" %}
{% load static %}

{% block style %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="{% static 'css/advice.css' %}">
{% endblock %}

{% block body %}
<div id="advice-body">
    <h1 id="title">Advice</h1>

    <div id="display-div" class="row row-cols-1 row-cols-md-3 g-4">
        {% for article in all_articles %}
        <div id="advice{{article.id}}" class="card">
            <a href="{% url 'article' article.id %}"><img src="{% get_static_prefix %}img/img{{ article.id }}.jpg" class="card-img-top go-to-article" alt="..."></a>
            <div class="card-body">
                <h5 class="card-title">{{ article.title }}</h5>
                <p class="card-text"> {{ article.subtitle }} </p>
                <a href="{% url 'article' article.id %}" class="btn btn-purple go-to-article">Read more</a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
