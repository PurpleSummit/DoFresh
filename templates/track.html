{% extends "layout.html" %}

{% block style %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="static/css/track.css">
<script src="static/js/track.js"></script>
</script>
{% endblock %}

{% block body %}
<div style="display: flex;">
    <div id="todo-lists-sidebar" class="sidebar">
        <p>To-Do Lists:</p>
    </div>

    <div id="track-body">
        <div style="display: flex;">
            <button id="sidebar-open-btn" class="btn btn-light" onclick="closeNav()"
                aria-label="Close">&#9776;</button>
            <h1 id="title">Track</h1>
            <span id="title-selected-list"></span>
        </div>

        <div id="todo-tasks-nav">
        </div>

        <div id="track-chart-div">
            <canvas id="task-content">
            </canvas>
        </div>

        <div id="chart-settings-div" style="display: flex;">
        </div>

    </div>
</div>

{% endblock %}
